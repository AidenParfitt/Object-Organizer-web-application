<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assingment 3</title>
    <link rel="stylesheet" href="ASN03.css" />
    <script src="ASN03.js"></script>
  </head>
  <body>
    <h1>Video Game Manager</h1>
    <div id="game-container"></div>

    <div id="Search-Container">
      <h3>Search for Items</h3>
      <p>Search Title:</p>
      <input class="searchTitle" type="text" />
      <button id="titleSearch">Search Title</button>

      <p>Search for Release date:</p>
      <p>Min:</p>
      <input class="searchMinRelease" type="number" />
      <p>Max:</p>
      <input class="searchMaxRelease" type="number" />
      <button id="releaseSearch">Search Release Date</button>

      <p>Search for publisher:</p>
      <input class="searchPublisher" type="text" />
      <button id="PublisherSearch">Search Publisher</button>

      <p>Search for genre:</p>
      <input class="searchGenre" type="text" />
      <button id="GenreSearch">Search Genre</button>
    </div>

    <div id="item-container">
      <h3>Add New Game</h3>
      <p>Title:</p>
      <input class="Title" type="text" />
      <p>Release Date:</p>
      <input class="Release" type="number" />
      <p>publisher:</p>
      <input class="Pub" type="text" />
      <p>Genre:</p>
      <input class="Genre" type="text" />

      <button id="Game">Add Game</button>
    </div>
    <div id="NewItem"></div>
  </body>
</html>
